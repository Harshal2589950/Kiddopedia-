<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kids Learning App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="app">
    
    <!-- Header -->
<header class="app-header">
    <span class="rainbow left">🌈</span>
    <h1 class="kiddopedia-title">Kiddopedia</h1>
    <span class="rainbow left">🌈</span>
</header>

    <!-- Main Menu -->
    <main>
      <div class="grid">
        <button id="btn-letters" class="menu-btn">📚 Alphabets</button>
        <button id="btn-numbers" class="menu-btn">🔢 Numbers</button>
		<button id="btn-months" class="menu-btn">📅 Months</button>
        <button id="btn-colors" class="menu-btn">🎨 Colours</button>
        <button id="btn-fruits" class="menu-btn">🍎 Fruits</button>
        <button id="btn-vegetables" class="menu-btn">🥕 Vegetables</button>
        <button id="btn-animals" class="menu-btn">🐶 Animals</button>

        <!-- UPDATED: Water Birds removed, Months added -->
        <button id="btn-birds" class="menu-btn">🕊️ Birds</button>
        <button id="btn-vehicles" class="menu-btn">🚗 Vehicles</button>
        <button id="btn-shapes" class="menu-btn">🔷 Shapes</button>
      </div>

      <!-- Display Screen -->
      <section id="screen" class="card">
        <div id="screen-content">Tap a button to start learning</div>
      </section>
    </main>
	<footer class="app-footer">
  <strong>Developed by — <span>Harshal</span>
</footer>

  </div>
 
  <script src="script.js"></script>
</body>
</html>
